version: '3.8'

services:
  scripttoframe:
    build:
      context: .
      dockerfile: Dockerfile.node16
    container_name: scripttoframe-node16-app
    restart: unless-stopped
    ports:
      - "3000:3000"   # 前端端口
      - "8081:8081"   # 后端API端口
    environment:
      # Node.js 16 兼容环境变量
      - NODE_VERSION=16
      - VOLCENGINE_ACCESS_KEY_ID=${VOLCENGINE_ACCESS_KEY_ID}
      - VOLCENGINE_SECRET_ACCESS_KEY=${VOLCENGINE_SECRET_ACCESS_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - PYTHON_BACKEND_URL=http://localhost:8081
      - NEXT_PUBLIC_APP_NAME=ScriptToFrame
      - NEXT_PUBLIC_VERSION=1.0.0
      - NODE_ENV=production
    volumes:
      - ./logs:/app/logs
      - app_data:/app/data
    networks:
      - scripttoframe-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  app_data:

networks:
  scripttoframe-network:
    driver: bridge